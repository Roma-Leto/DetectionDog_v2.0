[project]
name = "detectiondog"
version = "2.0.0"
description = "Инвентаризация вещей в квартире с распознаванием по фото"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Roma-Leto" }
]
license = { text = "MIT" }

dependencies = [
    # --- Web framework ---
    "flask>=3.0,<4.0",
    "waitress>=3.0,<4.0",

    # --- Database ---
    "flask-sqlalchemy>=3.1,<4.0",
    "flask-migrate>=4.0,<5.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",

    # --- Forms & Auth ---
    "flask-wtf>=1.2,<2.0",
    "wtforms>=3.1,<4.0",
    "flask-login>=0.6,<1.0",
    "email-validator>=2.1,<3.0",

    # --- Images ---
    "pillow>=10.2,<11.0",

    # --- HTTP client (vision-сервис) ---
    "requests>=2.31,<3.0",

    # --- Config ---
    "python-dotenv>=1.0,<2.0",

    # --- CLI ---
    "click>=8.1,<9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-flask>=1.3,<2.0",
    "pytest-cov>=4.1,<5.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.9,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ============================================================
# Ruff — линтер и форматтер
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "DJ",  # flake8-django
]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============================================================
# Pytest
# ============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# ============================================================
# MyPy
# ============================================================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]
