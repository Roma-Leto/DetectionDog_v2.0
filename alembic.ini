# Конфигурация Alembic для DetectionDog v2.0

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# URL базы берётся из app.config, а не отсюда
sqlalchemy.url =

[post_write_hooks]
# Автоформат миграций через ruff (опционально)
# hooks = ruff_format
# ruff_format.type = exec
# ruff_format.executable = ruff
# ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S