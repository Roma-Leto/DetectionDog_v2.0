[project]
name = "detectiondog-vision"
version = "1.0.0"
description = "Vision service for DetectionDog: photo analysis via Moondream"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "Roma-Leto" }
]

dependencies = [
    # --- Web framework ---
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9",

    # --- ML ---
    # Версия torch зафиксирована, чтобы uv не тянул CPU-сборку
    # с PyPI (2.14.0 > 2.5.1 без учёта суффикса).
    # Источник (CUDA 12.1) задан в [tool.uv.sources].
    "torch==2.5.1",
    "torchvision==0.20.1",
    # transformers 4.50+ удалил GenerationMixin из PreTrainedModel,
    # из-за чего Moondream2 rev 2024-08-26 ломается:
    # 'PhiForCausalLM' object has no attribute 'generate'.
    # Требуется <4.50 для совместимости с trust_remote_code модели.
    "transformers>=4.45,<4.50",
    "accelerate>=0.33,<2.0",
    "pillow>=10.2,<11.0",
    "safetensors>=0.4,<1.0",
    "huggingface-hub>=0.25,<1.0",

    # --- Зависимости Moondream2 (trust_remote_code) ---
    # Модель несёт свой код, который требует эти библиотеки.
    # Без них transformers откажется загружать модель.
    "einops>=0.8,<1.0",
    "timm>=1.0,<2.0",           # для vision encoder
    "sentencepiece>=0.2,<1.0",   # для tokenizer

    # --- Утилиты ---
    "python-dotenv>=1.0,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.4,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ============================================================
# uv: источник torch/torchvision — CUDA 12.1 от PyTorch
# ============================================================
# Ключевое: указываем uv, что torch/torchvision надо брать
# из репозитория PyTorch (cu121), а не с PyPI.
# Без этого uv sync перезапишет CUDA-сборку на CPU.
[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

# ============================================================
# Ruff
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"

# ============================================================
# Pytest
# ============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"